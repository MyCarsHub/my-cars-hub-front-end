<app-default-page-layout title="Editar apólice">
  @if (loading()) {
    <div class="rounded-2xl bg-white border border-neutral-200 p-8 text-center text-neutral-500 text-sm">
      Carregando…
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 sm:space-y-6" novalidate>
      @if (error(); as message) {
        <app-alert-banner [variant]="readOnly() ? 'warning' : 'error'" [message]="message" />
      }

      <app-page-card title="Dados da apólice">
        <div class="p-4 sm:p-6">
          <app-insurance-form-fields [formGroup]="form" />
        </div>
      </app-page-card>

      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3">
        <button
          type="button"
          (click)="cancel()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-medium text-neutral-700
                 bg-white border border-neutral-200 hover:bg-neutral-50
                 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
        >
          Voltar
        </button>
        <button
          type="submit"
          [disabled]="saving() || readOnly()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-medium text-white
                 bg-primary-500 hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed
                 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
        >
          {{ saving() ? 'Salvando…' : 'Salvar alterações' }}
        </button>
      </div>
    </form>

    <div class="pt-4">
      <a routerLink="/seguros" class="text-sm text-primary-700 hover:text-primary-800 font-medium">
        ← Voltar para a lista
      </a>
    </div>
  }
</app-default-page-layout>
