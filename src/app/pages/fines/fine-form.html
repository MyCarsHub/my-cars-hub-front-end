<app-default-page-layout
  [title]="isEdit() ? 'Editar multa' : 'Nova multa'"
  description="Registre uma infração para um veículo da frota."
>
  @if (loading()) {
    <div class="rounded-2xl bg-white border border-neutral-200 p-8 text-center text-neutral-500 text-sm">
      Carregando…
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 sm:space-y-6">
      @if (error(); as formError) {
        <app-alert-banner variant="error" [message]="formError" />
      }

      <app-page-card title="Veículo e motorista">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          <app-form-field
            label="Veículo"
            controlId="fine-vehicle"
            [required]="true"
            [hint]="isEdit() ? 'Veículo não pode ser alterado.' : ''"
            [control]="form.controls.vehicleId"
            [messages]="vehicleMessages"
          >
            <select
              appFieldControl
              formControlName="vehicleId"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors
                     disabled:opacity-60"
            >
              <option value="">Selecione…</option>
              @for (v of vehicles(); track v.id) {
                <option [value]="v.id">{{ v.plate }} · {{ v.brand }} {{ v.model }}</option>
              }
            </select>
          </app-form-field>

          <app-form-field
            label="Motorista"
            controlId="fine-driver"
            [control]="form.controls.driverId"
          >
            <select
              appFieldControl
              formControlName="driverId"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors"
            >
              <option value="">Não informado</option>
              @for (d of drivers(); track d.id) {
                <option [value]="d.id">{{ d.name }}</option>
              }
            </select>
          </app-form-field>
        </div>
      </app-page-card>

      <app-page-card title="Infração">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          <app-form-field
            class="md:col-span-2"
            label="Descrição"
            controlId="fine-desc"
            [required]="true"
            [control]="form.controls.description"
            [messages]="descriptionMessages"
          >
            <input
              appFieldControl
              type="text"
              maxlength="300"
              formControlName="description"
              placeholder="Ex: Excesso de velocidade em rodovia"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>

          <app-form-field label="Código" controlId="fine-code" [control]="form.controls.infractionCode">
            <input
              appFieldControl
              type="text"
              maxlength="20"
              formControlName="infractionCode"
              placeholder="Ex: 745-50"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>

          <app-form-field
            label="Data/hora da infração"
            controlId="fine-date"
            [required]="true"
            [control]="form.controls.infractionDate"
            [messages]="infractionDateMessages"
          >
            <input
              appFieldControl
              type="datetime-local"
              formControlName="infractionDate"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>

          <app-form-field
            class="md:col-span-2"
            label="Local"
            controlId="fine-location"
            [control]="form.controls.location"
          >
            <input
              appFieldControl
              type="text"
              maxlength="200"
              formControlName="location"
              placeholder="Ex: Av. Paulista, km 5"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>
        </div>
      </app-page-card>

      <app-page-card title="Valor e gravidade">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
          <app-form-field
            label="Valor (R$)"
            controlId="fine-amount"
            [required]="true"
            [control]="form.controls.amountReais"
            [messages]="amountMessages"
          >
            <input
              appFieldControl
              type="number"
              step="0.01"
              min="0.01"
              inputmode="decimal"
              formControlName="amountReais"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>

          <app-form-field
            label="Gravidade"
            controlId="fine-severity"
            [required]="true"
            [control]="form.controls.severity"
          >
            <select
              appFieldControl
              formControlName="severity"
              (change)="onSeverityChange()"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors">
              @for (opt of severityOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }} ({{ opt.defaultPoints }} pts)</option>
              }
            </select>
          </app-form-field>

          <app-form-field
            label="Pontos"
            controlId="fine-points"
            hint="Preenchido pela gravidade se vazio."
            [control]="form.controls.points"
          >
            <input
              appFieldControl
              type="number"
              min="0"
              formControlName="points"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>
        </div>
      </app-page-card>

      <app-page-card title="Pagamento">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
          <app-form-field label="Vencimento" controlId="fine-due" [control]="form.controls.dueDate">
            <input
              appFieldControl
              type="date"
              formControlName="dueDate"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>

          <app-form-field
            label="Status"
            controlId="fine-status"
            [required]="true"
            [control]="form.controls.status"
          >
            <select
              appFieldControl
              formControlName="status"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors">
              @for (opt of statusOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </app-form-field>

          <app-form-field
            label="Data do pagamento"
            controlId="fine-paid"
            [control]="form.controls.paidDate"
          >
            <input
              appFieldControl
              type="date"
              formControlName="paidDate"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>

          <app-form-field
            class="md:col-span-3"
            label="Observações"
            controlId="fine-notes"
            [control]="form.controls.notes"
          >
            <textarea
              appFieldControl
              rows="3"
              formControlName="notes"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors"></textarea>
          </app-form-field>
        </div>
      </app-page-card>

      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3">
        <button
          type="button"
          (click)="cancel()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-medium text-neutral-700
                 bg-white border border-neutral-200 hover:bg-neutral-50">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="saving()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-semibold bg-primary-500 text-white
                 hover:bg-primary-600 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
          {{ saving() ? 'Salvando…' : (isEdit() ? 'Salvar alterações' : 'Cadastrar multa') }}
        </button>
      </div>
    </form>
  }
</app-default-page-layout>
