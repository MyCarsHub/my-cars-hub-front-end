<app-default-page-layout
  title="Novo ajuste"
  description="Cobre de um motorista um valor fora das parcelas do aluguel."
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 sm:space-y-6" novalidate>
    @if (error(); as formError) {
      <app-alert-banner variant="error" [message]="formError" />
    }

    <app-page-card title="Ajuste">
      <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
        <app-form-field
          class="md:col-span-2"
          label="Motorista"
          controlId="adjustment-driver"
          [required]="true"
          [describedByExtra]="driversError() ? 'adjustment-driver-load-error' : driversEmpty() ? 'adjustment-driver-empty' : ''"
          [control]="form.controls.driverId"
          [messages]="driverMessages"
        >
          <!-- Não é <select>: a lista nativa é desenhada pelo navegador e no Chrome do desktop
               (tema escuro) abria mais estreita que o campo, com o texto cortado à esquerda. -->
          <button
            appFieldControl
            type="button"
            aria-haspopup="dialog"
            data-testid="adjustment-driver-trigger"
            [attr.aria-label]="driverAriaLabel()"
            [attr.aria-expanded]="driverPickerOpen()"
            [disabled]="!driversLoaded() || drivers().length === 0"
            (click)="openDriverPicker()"
            (blur)="onDriverTriggerBlur()"
            class="w-full min-h-[50px] bg-surface-muted border rounded-xl px-4 py-3 text-base text-left
                   flex items-center gap-3 focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600
                   transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
          >
            <span class="min-w-0 flex-1 truncate" [class.text-fg-body]="selectedDriver()" [class.text-fg-faint]="!selectedDriver()">
              {{ selectedDriver() ? (selectedDriver()!.name | personName) : (driversLoaded() ? 'Escolha o motorista' : 'Carregando…') }}
            </span>
            <svg class="shrink-0 text-fg-faint" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          @if (driversError(); as loadError) {
            <app-alert-banner variant="error" class="mt-2" data-testid="adjustment-driver-load-error">
              <span id="adjustment-driver-load-error">{{ loadError }}</span>
              <button type="button" class="ml-2 underline font-semibold min-h-11 px-1" (click)="loadDrivers()">
                Tentar novamente
              </button>
            </app-alert-banner>
          } @else if (driversEmpty()) {
            <p class="text-sm text-fg-subtle mt-2" data-testid="adjustment-driver-empty">
              <span id="adjustment-driver-empty">Nenhum motorista cadastrado nesta empresa.</span>
              <a routerLink="/motoristas/novo" class="ml-1 inline-flex items-center min-h-11 font-semibold text-primary-700 dark:text-primary-400 underline">
                Cadastrar motorista
              </a>
            </p>
          }
        </app-form-field>

        <app-form-field
          label="Valor (R$)"
          controlId="adjustment-amount"
          [required]="true"
          [control]="form.controls.amountReais"
          [messages]="amountMessages"
        >
          <!-- type="text": `type="number"` recusa a vírgula do teclado pt-BR e impede a máscara. -->
          <input
            appFieldControl
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="180,00"
            formControlName="amountReais"
            (input)="onMoneyInput($event)"
            class="w-full bg-surface-muted border rounded-xl px-4 py-3 text-base text-fg-body tabular-nums
                   focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors"
          />
        </app-form-field>

        <app-form-field
          label="Vencimento"
          controlId="adjustment-due"
          [required]="true"
          [hint]="dueHint"
          [control]="form.controls.dueDate"
          [messages]="dueMessages"
        >
          <input
            appFieldControl
            type="date"
            [attr.min]="minDate"
            [attr.max]="maxDate"
            formControlName="dueDate"
            class="w-full bg-surface-muted border rounded-xl px-4 py-3 text-base text-fg-body
                   focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors"
          />
        </app-form-field>

        <app-form-field
          class="md:col-span-2"
          label="Motivo"
          controlId="adjustment-description"
          [required]="true"
          hint="O motorista vê este texto na cobrança."
          [control]="form.controls.description"
          [messages]="descriptionMessages"
        >
          <input
            appFieldControl
            type="text"
            [attr.maxlength]="descriptionMax"
            formControlName="description"
            placeholder="Ex: Lavagem do carro na devolução"
            class="w-full bg-surface-muted border rounded-xl px-4 py-3 text-base text-fg-body
                   focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors"
          />
        </app-form-field>
      </div>
    </app-page-card>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-end gap-3 sm:gap-4">
      <p class="text-xs text-fg-muted sm:text-right sm:max-w-95">O motorista paga por Pix, pelo QR ou pelo copia-e-cola.</p>
      <div class="flex flex-col-reverse sm:flex-row gap-2 sm:gap-3">
        <a
          routerLink="/ajustes"
          class="w-full sm:w-auto inline-flex items-center justify-center min-h-11 px-5 py-3 rounded-xl text-sm font-medium text-fg-soft
                 bg-surface border border-edge hover:bg-surface-muted"
        >
          Cancelar
        </a>
        <button
          type="submit"
          data-submit
          [disabled]="saving()"
          class="w-full sm:w-auto min-h-11 px-5 py-3 rounded-xl text-sm font-semibold bg-primary-500 text-white
                 hover:bg-primary-600 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed"
        >
          {{ saving() ? 'Emitindo…' : 'Emitir cobrança' }}
        </button>
      </div>
    </div>
  </form>
</app-default-page-layout>

@if (driverPickerOpen()) {
  <app-bottom-sheet title="Escolha o motorista" (closed)="onDriverPickerClosed()">
    <div class="pb-2">
      <app-driver-picker
        [drivers]="pickerDrivers()"
        [total]="driversTotal()"
        [selectedId]="form.controls.driverId.value"
        (picked)="pickDriver($event)"
        (searched)="onDriverSearch($event)"
      />
    </div>
  </app-bottom-sheet>
}
