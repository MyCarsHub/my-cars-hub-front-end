<div class="min-w-0" data-financial-calendar>
    <!-- Header: month subtitle left, Hoje + arrows right (pulled up beside the card title from sm) -->
    <div class="flex items-center justify-between gap-2 mb-4 sm:h-12 sm:-mt-[3.25rem]">
        <p class="text-xs text-fg-muted sm:self-end min-w-0 truncate" data-calendar-month>{{ monthLabel() }}</p>
        <div class="flex items-center gap-1.5 shrink-0">
            <button
                type="button"
                class="size-11 rounded-xl bg-surface-sunken text-fg-soft hover:text-fg focus:outline-none
                       focus-visible:ring-2 focus-visible:ring-primary-400 flex items-center justify-center"
                aria-label="Mês anterior"
                (click)="prevMonth()"
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
            <button
                type="button"
                class="min-h-11 px-3.5 rounded-xl bg-surface-sunken text-fg-soft text-sm font-medium hover:text-fg
                       focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
                (click)="goToday()"
            >
                Hoje
            </button>
            <button
                type="button"
                class="size-11 rounded-xl bg-surface-sunken text-fg-soft hover:text-fg focus:outline-none
                       focus-visible:ring-2 focus-visible:ring-primary-400 flex items-center justify-center"
                aria-label="Próximo mês"
                (click)="nextMonth()"
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 6l6 6-6 6" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Weekday header: single letters -->
    <div class="grid grid-cols-7 gap-1 mb-1.5">
        @for (w of weekdays; track $index) {
            <div class="min-w-0 text-xs text-fg-subtle text-center" [attr.aria-label]="w.name" data-weekday>
                {{ w.letter }}
            </div>
        }
    </div>

    <!-- Grid: square cells, day number + dots only -->
    <div class="grid grid-cols-7 gap-1">
        @for (cell of cells(); track $index) {
            @if (cell.isPad) {
                <div class="min-w-0 aspect-square rounded-xl bg-surface-sunken/40"></div>
            } @else {
                <button
                    type="button"
                    class="min-w-0 aspect-square rounded-xl bg-surface-sunken flex items-center justify-center gap-0.5
                           text-sm tabular-nums transition-colors
                           focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
                    [class.border-2]="cell.isToday"
                    [class.border-primary-500]="cell.isToday"
                    [class.font-semibold]="cell.isToday"
                    [class.text-primary-500]="cell.isToday"
                    [class.text-fg-body]="!cell.isToday"
                    [class.ring-2]="selectedDate() === cell.date"
                    [class.ring-primary-500]="selectedDate() === cell.date"
                    [attr.aria-label]="cellLabel(cell)"
                    [attr.aria-current]="cell.isToday ? 'date' : null"
                    [attr.data-today]="cell.isToday ? '' : null"
                    (click)="onCellClick(cell)"
                >
                    <span>{{ cell.dayOfMonth }}</span>
                    @if (cell.inCount > 0) {
                        <span class="shrink-0 size-1.5 rounded-full bg-emerald-500" data-dot="in" aria-hidden="true"></span>
                    }
                    @if (cell.outCount > 0) {
                        <span class="shrink-0 size-1.5 rounded-full bg-red-500" data-dot="out" aria-hidden="true"></span>
                    }
                </button>
            }
        }
    </div>

    <!-- Month tiles (they double as the legend): label + value only -->
    <div class="grid grid-cols-3 gap-2 mt-4">
        <div class="min-w-0 rounded-xl bg-surface-sunken px-3 py-2.5" data-tile="in">
            <p class="flex items-center gap-1 text-xs text-fg-muted">
                <span class="shrink-0 size-1.5 rounded-full bg-emerald-500" aria-hidden="true"></span>
                <span class="truncate">Recebimentos</span>
            </p>
            <p class="text-sm sm:text-base font-semibold text-emerald-600 dark:text-emerald-300 tabular-nums">{{ inLabel() }}</p>
        </div>
        <div class="min-w-0 rounded-xl bg-surface-sunken px-3 py-2.5" data-tile="out">
            <p class="flex items-center gap-1 text-xs text-fg-muted">
                <span class="shrink-0 size-1.5 rounded-full bg-red-500" aria-hidden="true"></span>
                <span class="truncate">Pagamentos</span>
            </p>
            <p class="text-sm sm:text-base font-semibold text-red-600 dark:text-red-300 tabular-nums">{{ outLabel() }}</p>
        </div>
        <div class="min-w-0 rounded-xl bg-surface-sunken px-3 py-2.5" data-tile="balance">
            <p class="text-xs text-fg-muted">Saldo projetado</p>
            <p class="text-sm sm:text-base font-semibold text-fg-body tabular-nums">{{ balanceLabel() }}</p>
        </div>
    </div>
</div>
