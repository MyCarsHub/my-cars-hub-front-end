<app-default-page-layout
  title="Integração"
  description="Conecte serviços externos ao MyCarsHub. Escolha um provedor abaixo para configurar."
>
  <!-- Falha ao carregar o status — distingue "falhou" de "nada configurado". -->
  @if (error(); as loadError) {
    <div class="mb-3 sm:mb-4">
      <app-alert-banner variant="error" [message]="loadError" />
    </div>
  }

  <ul
    role="list"
    class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4"
  >
    @for (integration of integrations; track integration.key) {
      <li>
        <a
          [routerLink]="integration.route"
          class="group flex h-full min-h-[132px] flex-col justify-between gap-4 rounded-2xl border border-edge bg-surface p-4 sm:p-5 shadow-sm transition-all hover:-translate-y-0.5 hover:border-primary-300 dark:hover:border-primary-500/40 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2"
          [attr.aria-label]="'Configurar integração ' + integration.name"
        >
          <div class="flex items-start justify-between gap-3">
            <img
              [src]="integration.logo"
              [alt]="integration.logoAlt"
              height="28"
              class="h-7 w-auto"
            />
            @if (isConnected(integration.key)) {
              <span
                class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200 dark:border-emerald-500/30 bg-emerald-50 dark:bg-emerald-500/10 px-2.5 py-1 text-[11px] font-semibold text-emerald-800 dark:text-emerald-200"
              >
                <span
                  class="h-1.5 w-1.5 rounded-full bg-emerald-500"
                  aria-hidden="true"
                ></span>
                Conectado
              </span>
            } @else {
              <span
                class="inline-flex items-center gap-1.5 rounded-full border border-edge bg-surface-muted px-2.5 py-1 text-[11px] font-semibold text-fg-muted"
              >
                <span
                  class="h-1.5 w-1.5 rounded-full bg-neutral-400 dark:bg-neutral-500"
                  aria-hidden="true"
                ></span>
                Não configurado
              </span>
            }
          </div>

          <div class="min-w-0">
            <p class="text-base font-semibold text-fg">
              {{ integration.name }}
            </p>
            <p class="mt-1 text-sm text-fg-subtle leading-relaxed">
              {{ integration.description }}
            </p>
          </div>

          <span
            class="inline-flex items-center gap-1 text-sm font-semibold text-primary-700 dark:text-primary-400 transition-colors group-hover:text-primary-800 dark:group-hover:text-primary-400"
          >
            Configurar
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              class="transition-transform group-hover:translate-x-0.5"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
        </a>
      </li>
    }
  </ul>
</app-default-page-layout>
