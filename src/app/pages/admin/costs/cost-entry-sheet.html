<app-bottom-sheet [title]="title()" [subtitle]="subtitle()" [busy]="saving()" (closed)="closed.emit()">
  <form class="flex flex-col gap-4" data-testid="cost-entry-sheet" (ngSubmit)="submit()" novalidate>
    @if (cost(); as c) {
      <app-sheet-menu label="Mais opções do lançamento">
        <div sheetMenuLead>
          <app-status-chip tone="neutral" size="sm">{{ kindLabel[c.kind] }}</app-status-chip>
          @if (c.overridden) {
            <app-status-chip tone="amber" size="sm">editado</app-status-chip>
          }
        </div>
        @if (fixed() && c.overridden) {
          <button type="button" dataListMenuItem data-testid="entry-revert" (click)="revert()">
            <span class="flex flex-col">
              <span class="font-semibold text-fg">Voltar ao valor do fixo</span>
              @if (revertText(); as t) {
                <small class="text-xs text-fg-subtle">{{ t }}</small>
              }
            </span>
          </button>
        }
        @if (fixed() && canChangeFixed()) {
          <button type="button" dataListMenuItem data-testid="entry-change-fixed" (click)="askChangeFixed()">
            <span class="flex flex-col">
              <span class="font-semibold text-fg">Mudar o custo fixo daqui para frente</span>
              <small class="text-xs text-fg-subtle">Abre o custo fixo de {{ c.vendorName }}</small>
            </span>
          </button>
        }
        <button type="button" dataListMenuItem="danger" data-testid="entry-remove" (click)="askRemove()">
          <span class="flex flex-col">
            <span class="font-semibold">Tirar este custo só de {{ monthWord() }}</span>
            <small class="text-xs text-fg-subtle">Os outros meses não mudam</small>
          </span>
        </button>
      </app-sheet-menu>

      @if (onlyThisMonth(); as text) {
        <p class="rounded-2xl bg-surface-sunken px-4 py-3 text-sm text-fg" data-testid="entry-only-month">
          <b class="font-semibold">Muda só este mês.</b> {{ text }}
        </p>
      }
    } @else {
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium text-fg-muted">Fornecedor</span>
        <select [formControl]="vendorControl" data-testid="entry-vendor" [class]="field">
          @for (v of activeVendors(); track v.id) {
            <option [value]="v.id">{{ optionLabel(v) }}</option>
          }
          <option [value]="newVendor">Novo fornecedor…</option>
        </select>
      </label>
      @if (creatingVendor()) {
        <app-vendor-fields class="rounded-2xl bg-surface-sunken p-4" data-testid="entry-new-vendor" [form]="vendorForm" />
      }
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium text-fg-muted">Mês</span>
        <input type="month" [formControl]="monthControl" data-testid="entry-month" [class]="field + ' tabular-nums'" />
      </label>
    }

    @if (!fixed()) {
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium text-fg-muted">O que foi pago</span>
        <input type="text" autocomplete="off" [attr.maxlength]="maxDescription" placeholder="Ex.: Upgrade de disco"
               [formControl]="descriptionControl" data-testid="entry-description" [class]="field" />
      </label>
    }

    <div class="grid grid-cols-2 gap-3">
      <label class="flex flex-col gap-1 min-w-0">
        <span class="text-sm font-medium text-fg-muted">Valor em {{ monthWord() }}</span>
        <input type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"
               [formControl]="amountControl" (input)="onAmountInput($event)"
               [attr.aria-invalid]="amountError() ? 'true' : null"
               [attr.aria-describedby]="amountError() ? 'entry-amount-error' : null"
               data-testid="entry-amount" [class]="field + ' tabular-nums'" />
        @if (amountError(); as msg) {
          <span id="entry-amount-error" class="text-sm text-rose-700 dark:text-rose-300">{{ msg }}</span>
        }
      </label>
      <label class="flex flex-col gap-1 min-w-0">
        <span class="text-sm font-medium text-fg-muted">Vence em (opcional)</span>
        <input type="date" [min]="dueMin()" [max]="dueMax()" [formControl]="dueControl"
               data-testid="entry-due" [class]="field + ' tabular-nums'" />
      </label>
    </div>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-fg-muted">Nota (opcional)</span>
      <input type="text" autocomplete="off" [attr.maxlength]="maxNote" placeholder="Ex.: cobrado em dólar"
             [formControl]="noteControl" data-testid="entry-note" [class]="field" />
    </label>

    @if (error(); as msg) {
      <app-alert-banner variant="error" [message]="msg" data-testid="entry-error" />
    }

    <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Salvar</button>
  </form>

  <div sheetFooter class="pt-3 flex flex-col-reverse gap-2 lg:flex-row lg:justify-end">
    <button type="button" data-testid="entry-cancel" (click)="cancel()"
            class="press min-h-12 rounded-xl border border-edge px-5 text-base font-semibold text-fg hover:bg-surface-muted
                   focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
      Cancelar
    </button>
    <button type="button" data-testid="entry-save" [disabled]="saving()" (click)="submit()"
            class="press min-h-12 rounded-xl bg-primary-500 px-5 text-base font-semibold text-white hover:bg-primary-600
                   disabled:opacity-60 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
      {{ saving() ? 'Salvando…' : editing() ? 'Salvar só ' + monthWord() : 'Lançar avulso' }}
    </button>
  </div>
</app-bottom-sheet>
