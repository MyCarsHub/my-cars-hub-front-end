<app-bottom-sheet [title]="title()" [subtitle]="subtitle()" [busy]="saving()" (closed)="closed.emit()">
  <form class="flex flex-col gap-4" data-testid="cost-sheet" (ngSubmit)="submit()" novalidate>
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-fg-muted">Fornecedor</span>
      <select
        [formControl]="vendorControl"
        data-testid="cost-vendor"
        class="min-h-12 rounded-xl border border-edge-field bg-surface px-3 text-base text-fg
               focus:outline-none focus:ring-2 focus:ring-primary-400"
      >
        @for (v of activeVendors(); track v.id) {
          <option [value]="v.id">{{ vendorOptionLabel(v) }}</option>
        }
        <option [value]="otherVendor">Outro fornecedor (cadastrar)</option>
      </select>
    </label>

    @if (creating()) {
      <div class="flex flex-col gap-4 rounded-2xl bg-surface-sunken p-4" data-testid="cost-new-vendor">
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium text-fg-muted">Nome do fornecedor</span>
          <input
            type="text"
            autocomplete="off"
            maxlength="80"
            [formControl]="nameControl"
            data-testid="cost-vendor-name"
            class="min-h-12 rounded-xl border border-edge-field bg-surface px-3 text-base text-fg
                   focus:outline-none focus:ring-2 focus:ring-primary-400"
          />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium text-fg-muted">Tipo de custo</span>
          <select
            [formControl]="categoryControl"
            data-testid="cost-vendor-category"
            class="min-h-12 rounded-xl border border-edge-field bg-surface px-3 text-base text-fg
                   focus:outline-none focus:ring-2 focus:ring-primary-400"
          >
            @for (c of categoryOptions; track c.value) {
              <option [value]="c.value">{{ c.label }}</option>
            }
          </select>
        </label>
        @if (needsLabel()) {
          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium text-fg-muted">Que custo é esse</span>
            <input
              type="text"
              autocomplete="off"
              maxlength="60"
              [formControl]="labelControl"
              data-testid="cost-vendor-label"
              class="min-h-12 rounded-xl border border-edge-field bg-surface px-3 text-base text-fg
                     focus:outline-none focus:ring-2 focus:ring-primary-400"
            />
          </label>
        }
      </div>
    }

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium text-fg-muted">Mês</span>
        <input
          type="month"
          [formControl]="monthControl"
          data-testid="cost-month"
          class="min-h-12 rounded-xl border border-edge-field bg-surface px-3 text-base text-fg tabular-nums
                 focus:outline-none focus:ring-2 focus:ring-primary-400"
        />
      </label>
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium text-fg-muted">Valor de {{ monthLabel() }}</span>
        <input
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="0,00"
          [formControl]="amountControl"
          (input)="onAmountInput($event)"
          [attr.aria-invalid]="amountError() ? 'true' : null"
          [attr.aria-describedby]="amountError() ? 'cost-amount-error' : null"
          data-testid="cost-amount"
          class="min-h-12 rounded-xl border border-edge-field bg-surface px-3 text-base text-fg tabular-nums
                 focus:outline-none focus:ring-2 focus:ring-primary-400"
        />
        @if (amountError(); as msg) {
          <span id="cost-amount-error" class="text-sm text-rose-700 dark:text-rose-300">{{ msg }}</span>
        }
      </label>
    </div>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-fg-muted">Dia em que o fornecedor cobra</span>
      <input
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="2"
        placeholder="1 a 31"
        [formControl]="dayControl"
        aria-describedby="cost-day-hint"
        data-testid="cost-billing-day"
        class="min-h-12 rounded-xl border border-edge-field bg-surface px-3 text-base text-fg tabular-nums
               focus:outline-none focus:ring-2 focus:ring-primary-400"
      />
      <span id="cost-day-hint" class="text-xs text-fg-subtle">
        Vale para todos os meses e põe o fornecedor em "Próximos vencimentos".
      </span>
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-fg-muted">Nota (opcional)</span>
      <textarea
        rows="2"
        [attr.maxlength]="maxNote"
        [formControl]="noteControl"
        data-testid="cost-note"
        class="rounded-xl border border-edge-field bg-surface px-3 py-2.5 text-base text-fg
               focus:outline-none focus:ring-2 focus:ring-primary-400"
      ></textarea>
    </label>

    @if (error(); as msg) {
      <app-alert-banner variant="error" [message]="msg" data-testid="cost-error" />
    }

    <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Salvar</button>
  </form>

  <div sheetFooter class="pt-3">
    <button
      type="button"
      class="press min-h-12 w-full rounded-xl bg-primary-500 px-4 text-base font-semibold text-white hover:bg-primary-600
             disabled:opacity-60 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
      data-testid="cost-save"
      [disabled]="saving()"
      (click)="submit()"
    >
      {{ saving() ? 'Salvando…' : 'Salvar' }}
    </button>
  </div>
</app-bottom-sheet>
