<header
  class="sticky top-0 z-50 border-b transition-[background,border-color] duration-300"
  [class.bg-paper/72]="!scrolled()"
  [class.bg-paper/95]="scrolled()"
  [class.border-transparent]="!scrolled()"
  [class.border-rule]="scrolled()"
  style="backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);"
>
  <div class="max-w-[1200px] mx-auto px-5 md:px-4 lg:px-8 py-3 flex items-center gap-4 md:gap-2 lg:gap-8">
    <a
      routerLink="/"
      class="inline-flex items-center shrink-0"
      aria-label="MyCarsHub — início"
    >
      <img src="svg/logo-my-cars-hub-complete.svg" alt="MyCarsHub" class="h-6 lg:h-[26px] w-auto block" />
    </a>

    <!--
      Cinco âncoras não cabem na faixa md (768-1023px) com os valores de lg: ao lado do logo
      completo e do CTA sobram ~350px para um nav que mede 453px em lg. Por isso o md tem
      valores próprios (fonte 12.5px, gap 10px, logo h-6, padding px-4, CTA px-4/13px) e o
      bloco do CTA é shrink-0 — sem isso ele quebrava em duas linhas e esticava o header de
      69px para 85px. Medido: em 768px o nav precisa de 334px e sobram ~16px, nada cortado.
      O `min-w-0 + overflow-x-auto` é rede de segurança para fontes de fallback mais largas,
      e a barra é deixada VISÍVEL de propósito: se um dia algo não couber, o usuário vê que
      há mais conteúdo em vez de perder um link em silêncio. Não "limpe" esses valores sem
      medir de novo em 768px.
    -->
    <nav
      class="hidden md:flex mx-auto min-w-0 gap-[10px] lg:gap-7 overflow-x-auto"
      aria-label="Seções da landing"
    >
      @for (link of links; track link.href) {
        <a
          [href]="link.href"
          class="text-[12.5px] lg:text-[14.5px] font-medium text-ink/70 tracking-[-0.005em] whitespace-nowrap transition-colors duration-200 hover:text-brand"
        >{{ link.label }}</a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2 shrink-0">
      <a
        routerLink="/login"
        class="group relative isolate overflow-hidden inline-flex items-center gap-2 whitespace-nowrap px-4 sm:px-[18px] md:px-4 lg:px-[18px] py-2.5 rounded-full text-[13.5px] sm:text-sm md:text-[13px] lg:text-sm font-semibold text-white min-h-[44px] shadow-[0_1px_0_0_rgba(255,255,255,0.18)_inset,0_6px_18px_-6px_rgba(235,63,0,0.45)] hover:shadow-[0_1px_0_0_rgba(255,255,255,0.18)_inset,0_10px_26px_-6px_rgba(235,63,0,0.55)] hover:-translate-y-px active:translate-y-0 transition-all duration-300"
        style="background: linear-gradient(135deg, #FF5722 0%, #EB3F00 55%, #C93300 100%); background-size: 200% 100%; background-position: 0% 50%; transition: background-position 300ms cubic-bezier(0.16,1,0.3,1), transform 180ms, box-shadow 300ms;"
        onmouseover="this.style.backgroundPosition='100% 50%'"
        onmouseout="this.style.backgroundPosition='0% 50%'"
      >
        <span class="hidden sm:inline">Acessar Plataforma</span>
        <span class="sm:hidden">Acessar</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="transition-transform duration-200 group-hover:translate-x-0.5">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span
          aria-hidden="true"
          class="absolute inset-0 -z-10 -translate-x-[120%] group-hover:translate-x-[120%] transition-transform duration-[700ms] pointer-events-none"
          style="background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);"
        ></span>
      </a>
    </div>
  </div>
</header>
