<!--
  Planos (rev. 2026-10-29): a MESMA grade da Assinatura (`app-plan-grid`) — cinco
  colunas alinhadas por subgrid, mesma superfície para todos, só o Pro em
  destaque (borda acesa, "Mais escolhido", CTA cheio). Texto das colunas vem de
  `utils/plan-grid-copy.ts`, o mesmo que o app usa.
-->
<section id="planos" class="pricing relative isolate overflow-hidden bg-canvas px-5 md:px-8">
  <div class="wrap">
    <header class="head reveal">
      <span class="eyebrow">Planos</span>
      <h2 class="font-display font-bold m-0 text-balance">
        Do primeiro carro <span class="hl">à frota inteira</span>.
      </h2>
      <p class="lede">Comece com 14 dias grátis. Depois, o plano acompanha o tamanho da sua frota.</p>
    </header>

    <div class="reveal">
      <app-plan-grid
        [columns]="columns()"
        [cycle]="gridCycle()"
        [savings]="proSavings()"
        [pills]="true"
        (cycleChange)="setCycle($event === 'YEARLY' ? 'yearly' : 'monthly')"
        (choose)="goToLogin($event.tier)"
      />
    </div>

    <p class="trust" data-testid="pricing-trust">
      @for (item of trustItems; track item) {
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>{{ item }}</span>
      }
    </p>

  </div>
</section>
