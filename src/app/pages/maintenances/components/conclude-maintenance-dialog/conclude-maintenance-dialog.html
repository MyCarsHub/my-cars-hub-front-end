@if (open()) {
  <div
    @backdrop
    class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm"
    (click)="onCancel()"
    aria-hidden="true"
  ></div>

  <div
    @dialog
    role="dialog"
    aria-modal="true"
    aria-labelledby="conclude-maint-title"
    class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3 sm:p-4 pointer-events-none"
  >
    <div
      class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl border border-neutral-100 w-full max-w-md pointer-events-auto overflow-hidden"
    >
      <div class="flex items-start gap-3 sm:gap-4 p-4 sm:p-6 pb-3 sm:pb-4">
        <div
          class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center bg-emerald-50"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-emerald-700"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h2 id="conclude-maint-title" class="text-base font-semibold text-neutral-900 leading-snug">
            Concluir manutenção
          </h2>
          @if (entityLabel()) {
            <p class="mt-1 text-sm text-neutral-500 leading-relaxed break-words">
              {{ entityLabel() }}
            </p>
          }
        </div>
      </div>

      <div class="px-4 sm:px-6 pb-2">
        <label for="conclude-maint-hodometer" class="block text-sm font-medium text-neutral-700 mb-1.5">
          Hodômetro atual (km)
        </label>
        <!-- type="text" (não "number"): com number o browser devolve '' para
             entrada não numérica, o valor bruto some antes de chegar em parsed()
             e o erro inline abaixo nunca renderiza. -->
        <input
          #hodometerInput
          id="conclude-maint-hodometer"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          required
          [value]="value()"
          (input)="onInput($event)"
          [disabled]="busy()"
          [attr.aria-invalid]="invalid() || errorMessage() ? 'true' : null"
          [attr.aria-describedby]="describedBy()"
          class="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-4 py-3 min-h-[44px] text-neutral-800
                 tabular-nums focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500
                 focus-visible:border-primary-500 transition-colors disabled:opacity-60"
        />
        @if (invalid()) {
          <p id="conclude-maint-error" role="alert" class="mt-1.5 text-sm text-rose-700">
            Informe um número inteiro de quilômetros (0 ou maior).
          </p>
        } @else {
          <p id="conclude-maint-hint" class="mt-1.5 text-sm text-neutral-500">{{ hint() }}</p>
        }
        @if (errorMessage(); as serverError) {
          <p
            id="conclude-maint-server-error"
            role="alert"
            class="mt-2 rounded-lg bg-rose-50 border border-rose-200 px-3 py-2 text-sm text-rose-700"
          >
            {{ serverError }}
          </p>
        }
      </div>

      <div
        class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-end gap-2 sm:gap-3 p-4 sm:p-6 pt-3 sm:pt-4"
      >
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="busy()"
          class="w-full sm:w-auto px-4 py-2.5 min-h-[44px] text-sm font-medium text-neutral-700 bg-neutral-100
                 hover:bg-neutral-200 rounded-xl transition-colors focus-visible:outline-none
                 focus-visible:ring-2 focus-visible:ring-neutral-400 disabled:opacity-60 cursor-pointer"
        >
          Voltar
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="!canConfirm()"
          class="w-full sm:w-auto px-4 py-2.5 min-h-[44px] text-sm font-semibold rounded-xl transition-all shadow-sm
                 bg-primary-700 hover:bg-primary-800 text-white focus-visible:outline-none
                 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary-500
                 active:scale-[0.98] disabled:opacity-60 cursor-pointer"
        >
          {{ busy() ? 'Concluindo…' : 'Concluir manutenção' }}
        </button>
      </div>
    </div>
  </div>
}
