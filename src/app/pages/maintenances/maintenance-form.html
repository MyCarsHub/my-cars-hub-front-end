<app-default-page-layout
  [title]="isEdit() ? 'Editar manutenção' : 'Nova manutenção'"
  description="Registre um serviço realizado ou agende uma próxima manutenção."
>
  @if (loading()) {
    <div class="rounded-2xl bg-white border border-neutral-200 p-8 text-center text-neutral-500 text-sm">
      Carregando…
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 sm:space-y-6">
      @if (error(); as formError) {
        <app-alert-banner variant="error" [message]="formError" />
      }

      <app-page-card title="Veículo e serviço">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          <app-form-field
            label="Veículo"
            controlId="maint-vehicle"
            [required]="true"
            [hint]="isEdit() ? 'Veículo não pode ser alterado.' : ''"
            [control]="form.controls.vehicleId"
            [messages]="vehicleMessages"
          >
            <select
              appFieldControl
              formControlName="vehicleId"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors
                     disabled:opacity-60">
              <option value="">Selecione…</option>
              @for (v of vehicles(); track v.id) {
                <option [value]="v.id">{{ v.plate }} · {{ v.brand }} {{ v.model }}</option>
              }
            </select>
          </app-form-field>

          <app-form-field
            label="Tipo"
            controlId="maint-type"
            [required]="true"
            [control]="form.controls.type"
            [messages]="typeMessages"
          >
            <select
              appFieldControl
              formControlName="type"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors">
              @for (opt of typeOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </app-form-field>

          <app-form-field
            class="md:col-span-2"
            label="Descrição"
            controlId="maint-desc"
            [required]="true"
            [control]="form.controls.description"
            [messages]="descriptionMessages"
          >
            <input
              appFieldControl
              type="text"
              maxlength="300"
              formControlName="description"
              placeholder="Ex: Troca de óleo e filtros"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>

          <app-form-field
            label="Data do serviço"
            controlId="maint-date"
            [required]="true"
            [control]="form.controls.serviceDate"
            [messages]="serviceDateMessages"
          >
            <input
              appFieldControl
              type="date"
              formControlName="serviceDate"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>

          <app-form-field
            label="Status"
            controlId="maint-status"
            [required]="true"
            [control]="form.controls.status"
            [messages]="statusMessages"
          >
            <select
              appFieldControl
              formControlName="status"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors">
              @for (opt of statusOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </app-form-field>
        </div>
      </app-page-card>

      <app-page-card title="Medições e custo">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
          <app-form-field
            label="Hodômetro (km)"
            controlId="maint-hodo"
            [required]="hodometerRequired()"
            [hint]="hodometerHint()"
            [control]="form.controls.hodometerReading"
            [messages]="hodometerMessages"
          >
            <input
              appFieldControl
              type="number"
              min="0"
              inputmode="numeric"
              formControlName="hodometerReading"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>

          <app-form-field
            label="Custo (R$)"
            controlId="maint-cost"
            [required]="true"
            [control]="form.controls.costReais"
            [messages]="costMessages"
          >
            <input
              appFieldControl
              type="number"
              step="0.01"
              min="0"
              inputmode="decimal"
              formControlName="costReais"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>

          <app-form-field
            label="Fornecedor"
            controlId="maint-provider"
            [control]="form.controls.provider"
          >
            <input
              appFieldControl
              type="text"
              maxlength="120"
              formControlName="provider"
              placeholder="Ex: Oficina do Zé"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>

          <app-form-field
            label="Nota fiscal"
            controlId="maint-invoice"
            [control]="form.controls.invoiceNumber"
          >
            <input
              appFieldControl
              type="text"
              maxlength="60"
              formControlName="invoiceNumber"
              placeholder="Ex: NF-12345"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>
        </div>
      </app-page-card>

      <app-page-card title="Próxima manutenção (opcional)">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          <app-form-field
            label="Data prevista"
            controlId="maint-next-date"
            [control]="form.controls.nextServiceDate"
          >
            <input
              appFieldControl
              type="date"
              formControlName="nextServiceDate"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>

          <app-form-field
            label="Hodômetro previsto (km)"
            controlId="maint-next-hodo"
            [control]="form.controls.nextServiceHodometer"
          >
            <input
              appFieldControl
              type="number"
              min="0"
              inputmode="numeric"
              formControlName="nextServiceHodometer"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
          </app-form-field>

          <app-form-field
            class="md:col-span-2"
            label="Observações"
            controlId="maint-notes"
            [control]="form.controls.notes"
          >
            <textarea
              appFieldControl
              rows="3"
              formControlName="notes"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors"></textarea>
          </app-form-field>
        </div>
      </app-page-card>

      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3">
        <button
          type="button"
          (click)="cancel()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-medium text-neutral-700
                 bg-white border border-neutral-200 hover:bg-neutral-50">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="saving()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-semibold bg-primary-500 text-white
                 hover:bg-primary-600 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
          {{ saving() ? 'Salvando…' : (isEdit() ? 'Salvar alterações' : 'Cadastrar manutenção') }}
        </button>
      </div>
    </form>
  }
</app-default-page-layout>
