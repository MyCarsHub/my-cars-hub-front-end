<app-default-page-layout
  [title]="isEdit() ? 'Editar motorista' : 'Novo motorista'"
  description="Preencha as informações do motorista."
>
  @if (loading()) {
    <div class="rounded-2xl bg-white border border-neutral-200 p-8 text-center text-neutral-500 text-sm">
      Carregando…
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 sm:space-y-6">

      @if (error(); as formError) {
        <app-alert-banner variant="error" [message]="formError" />
      }

      <!-- ====== Informações Pessoais ====== -->
      <app-page-card title="Informações pessoais">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          <app-form-field
            class="md:col-span-2"
            [control]="form.controls.name"
            [messages]="nameMessages"
          >
            <app-primary-input label="Nome completo" [required]="true" placeholder="Ex: João da Silva" formControlName="name" />
          </app-form-field>

          <app-form-field
            class="md:col-span-2"
            label="RG"
            controlId="motorista-rg"
            [required]="true"
            [control]="form.controls.rg"
            [messages]="rgMessages"
          >
            <input
              appFieldControl
              type="text"
              inputmode="numeric"
              placeholder="12.345.678-9"
              maxlength="13"
              [value]="rgDisplay()"
              (input)="onRgInput($event)"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>
        </div>
      </app-page-card>

      <!-- ====== Contato ====== -->
      <app-page-card title="Contato">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6" formGroupName="contact">
          <app-form-field
            [control]="form.controls.contact.controls.email"
            [messages]="emailMessages"
          >
            <app-primary-input label="E-mail" [required]="true" type="email" placeholder="motorista@empresa.com" formControlName="email" />
          </app-form-field>

          <app-form-field
            label="Telefone"
            controlId="motorista-phone"
            [required]="true"
            [control]="form.controls.contact.controls.phone"
            [messages]="phoneMessages"
          >
            <input
              appFieldControl
              type="tel"
              inputmode="numeric"
              placeholder="(11) 98765-4321"
              maxlength="15"
              [value]="phoneDisplay()"
              (beforeinput)="onPhoneBeforeInput($event)"
              (input)="onPhoneInput($event)"
              class="w-full bg-white rounded-xl border px-4 py-3
                     focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-colors" />
          </app-form-field>
        </div>
      </app-page-card>

      <!-- ====== Endereço ====== -->
      <app-page-card title="Endereço">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-6 gap-4 sm:gap-6" formGroupName="address">
          <app-form-field
            class="md:col-span-2"
            label="CEP"
            controlId="motorista-cep"
            [required]="true"
            [hint]="cepLoading() ? 'Buscando endereço…' : ''"
            [control]="form.controls.address.controls.cep"
            [messages]="cepMessages"
          >
            <input
              appFieldControl
              type="text"
              formControlName="cep"
              placeholder="00000-000"
              maxlength="9"
              (blur)="onCepBlur()"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>

          <app-form-field
            class="md:col-span-4"
            [control]="form.controls.address.controls.street"
            [messages]="streetMessages"
          >
            <app-primary-input label="Rua" [required]="true" placeholder="Rua das Flores" formControlName="street" />
          </app-form-field>

          <div class="md:col-span-2">
            <app-primary-input label="Número" placeholder="123" formControlName="number" />
          </div>

          <div class="md:col-span-4">
            <app-primary-input label="Complemento" placeholder="Apto 4, bloco B" formControlName="complement" />
          </div>

          <app-form-field
            class="md:col-span-3"
            [control]="form.controls.address.controls.district"
            [messages]="districtMessages"
          >
            <app-primary-input label="Bairro" [required]="true" placeholder="Centro" formControlName="district" />
          </app-form-field>

          <app-form-field
            class="md:col-span-2"
            [control]="form.controls.address.controls.city"
            [messages]="cityMessages"
          >
            <app-primary-input label="Cidade" [required]="true" placeholder="São Paulo" formControlName="city" />
          </app-form-field>

          <app-form-field
            label="UF"
            controlId="motorista-uf"
            [required]="true"
            [control]="form.controls.address.controls.uf"
            [messages]="ufMessages"
          >
            <select
              appFieldControl
              formControlName="uf"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors">
              <option value="">—</option>
              @for (uf of ufs; track uf) {
                <option [value]="uf">{{ uf }}</option>
              }
            </select>
          </app-form-field>
        </div>
      </app-page-card>

      <!-- ====== CNH ====== -->
      <app-page-card title="Carteira de habilitação">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
          <app-form-field
            label="Número da CNH"
            controlId="motorista-cnh"
            [required]="true"
            [control]="form.controls.licenseNumber"
            [messages]="licenseNumberMessages"
          >
            <input
              appFieldControl
              type="text"
              placeholder="Ex: A1B2C3D4E5F"
              maxlength="11"
              autocapitalize="characters"
              [value]="licenseDisplay()"
              (input)="onLicenseInput($event)"
              class="w-full bg-white rounded-xl border px-4 py-3 tracking-wider
                     focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-colors" />
          </app-form-field>

          <app-form-field
            label="Categoria"
            controlId="motorista-categoria"
            [required]="true"
            [control]="form.controls.licenseCategory"
          >
            <select
              appFieldControl
              formControlName="licenseCategory"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors">
              @for (cat of categories; track cat) {
                <option [value]="cat">{{ cat }}</option>
              }
            </select>
          </app-form-field>

          <app-form-field
            label="Vencimento"
            controlId="motorista-vencimento"
            [required]="true"
            [control]="form.controls.licenseExpiry"
            [messages]="licenseExpiryMessages"
          >
            <input
              appFieldControl
              type="date"
              formControlName="licenseExpiry"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>
        </div>
      </app-page-card>

      <!-- ====== Associações ====== -->
      <app-page-card title="Associações">
        <div class="p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
          <div formGroupName="document" class="space-y-4">
            <app-form-field
              label="Tipo de documento"
              controlId="motorista-doc-tipo"
              [required]="true"
              [control]="form.controls.document.controls.type"
            >
              <select
                appFieldControl
                formControlName="type"
                class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                       focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors disabled:opacity-60">
                <option value="CPF">CPF</option>
                <option value="CNPJ">CNPJ</option>
              </select>
            </app-form-field>

            <app-form-field
              label="Número do documento"
              controlId="motorista-doc-valor"
              [required]="true"
              [hint]="isEdit() ? 'Documento não pode ser alterado após a criação.' : ''"
              [control]="form.controls.document.controls.value"
              [messages]="documentMessages"
            >
              <input
                appFieldControl
                type="text"
                placeholder="11 - 14 dígitos"
                maxlength="14"
                autocapitalize="characters"
                [value]="documentDisplay()"
                (input)="onDocumentInput($event)"
                [disabled]="isEdit()"
                class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tracking-wider
                       focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors disabled:opacity-60" />
            </app-form-field>
          </div>

          <app-form-field
            label="ID do usuário vinculado (opcional)"
            controlId="motorista-user-id"
            hint="Vincule apenas se o motorista já tiver conta na plataforma."
            [control]="form.controls.userId"
          >
            <input
              appFieldControl
              type="text"
              formControlName="userId"
              placeholder="UUID do usuário — deixe em branco se o motorista não tem login"
              class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
          </app-form-field>
        </div>
      </app-page-card>

      <!-- ====== Status ====== -->
      <app-page-card title="Status">
        <div class="p-4 sm:p-6">
          <app-form-field
            label="Situação atual"
            controlId="motorista-status"
            [required]="true"
            [control]="form.controls.status"
          >
            <select
              appFieldControl
              formControlName="status"
              class="w-full md:w-72 bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors">
              @for (s of statuses; track s.value) {
                <option [value]="s.value">{{ s.label }}</option>
              }
            </select>
          </app-form-field>
        </div>
      </app-page-card>

      <!-- ====== Ações ====== -->
      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3">
        <button
          type="button"
          (click)="cancel()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-medium text-neutral-700
                 bg-white border border-neutral-200 hover:bg-neutral-50">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="saving()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-semibold bg-primary-500 text-white
                 hover:bg-primary-600 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
          {{ saving() ? 'Salvando…' : (isEdit() ? 'Salvar alterações' : 'Cadastrar motorista') }}
        </button>
      </div>
    </form>
  }
</app-default-page-layout>
