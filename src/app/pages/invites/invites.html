<!--
  A MOLDURA e condicional, o CONTEUDO nao: `embedded` troca o cabecalho de pagina por
  nada, e o cartao do formulario e o MESMO objeto nos dois casos. O `ng-template` existe
  para que ele nao seja escrito duas vezes — duas copias divergiriam na primeira
  mudanca de regra de cargo.
-->
<ng-template #inviteBody>
  <!--
    Empilhado em TODA largura: formulário em cima, listagem embaixo. Antes eram
    duas colunas (`grid lg:grid-cols-3`), o que em 375px empurrava a lista para
    depois de um formulário inteiro sem nenhuma pista de que ela existia — e no
    desktop deixava o formulário sozinho em 1/3 da largura.

    O empilhamento também é a ordem da tarefa: convidar → conferir o que já foi
    enviado.
  -->
  <div class="space-y-4 sm:space-y-6 lg:space-y-8">
    <app-page-card title="Convidar pessoa">
      <div cardIcon class="p-2 bg-primary-low rounded-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-primary-500"
          aria-hidden="true"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <line x1="19" y1="8" x2="19" y2="14" />
          <line x1="22" y1="11" x2="16" y2="11" />
        </svg>
      </div>

      <!--
        Mobile-first: campos empilhados, lado a lado só a partir de md — são
        dois, e em 375px cada um ocupa a linha inteira.
      -->
      <form [formGroup]="inviteForm" (ngSubmit)="send()" novalidate class="p-4 sm:p-6 space-y-4">
        @if (createError(); as message) {
          <app-alert-banner variant="error" [message]="message" />
        }

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-form-field
            label="E-mail"
            controlId="invite-email"
            [required]="true"
            [control]="inviteForm.get('email')"
            [messages]="emailMessages"
          >
            <input
              appFieldControl
              formControlName="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              spellcheck="false"
              maxlength="255"
              placeholder="pessoa@empresa.com.br"
              class="w-full min-h-[44px] bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600
                     transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
            />
          </app-form-field>

          <app-form-field
            label="Nível de acesso"
            controlId="invite-role"
            [required]="true"
            [control]="inviteForm.get('role')"
            hint="Gerenciador administra a operação. Motorista tem acesso restrito."
          >
            <select
              appFieldControl
              formControlName="role"
              class="w-full min-h-[44px] bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                     focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600
                     transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
            >
              @for (option of roles; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
          </app-form-field>
        </div>

        <!-- Só o gerente precisa destes dados; para o motorista o backend os ignora, então
             pedi-los seria ruído. O bloco aparece e some com o cargo. -->
        @if (requiresManagerData()) {
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-form-field
              label="Nome completo"
              controlId="invite-name"
              [required]="true"
              [control]="inviteForm.get('name')"
              [messages]="nameMessages"
            >
              <input
                appFieldControl
                formControlName="name"
                type="text"
                autocomplete="name"
                maxlength="180"
                placeholder="Nome de quem vai gerenciar"
                class="w-full min-h-[44px] bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                       focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600
                       transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
              />
            </app-form-field>

            <app-form-field
              label="CPF"
              controlId="invite-cpf"
              [required]="true"
              [control]="inviteForm.get('cpf')"
              [messages]="cpfMessages"
            >
              <input
                appFieldControl
                formControlName="cpf"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="14"
                placeholder="000.000.000-00"
                (input)="onCpfInput($event)"
                class="w-full min-h-[44px] bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                       tabular-nums focus:outline-none focus:ring-2 focus:ring-primary-600
                       focus:border-primary-600 transition-colors disabled:opacity-60"
              />
            </app-form-field>

            <app-form-field
              label="Telefone"
              controlId="invite-phone"
              [required]="true"
              [control]="inviteForm.get('phone')"
              [messages]="phoneMessages"
            >
              <input
                appFieldControl
                formControlName="phone"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                maxlength="15"
                placeholder="(00) 00000-0000"
                (input)="onPhoneInput($event)"
                class="w-full min-h-[44px] bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
                       tabular-nums focus:outline-none focus:ring-2 focus:ring-primary-600
                       focus:border-primary-600 transition-colors disabled:opacity-60"
              />
            </app-form-field>
          </div>
        }

        <div class="flex flex-col sm:flex-row sm:justify-end">
          <button
            type="submit"
            [disabled]="sending()"
            [attr.aria-busy]="sending() ? 'true' : null"
            class="w-full sm:w-auto min-h-[44px] px-5 py-3 rounded-xl text-sm font-semibold bg-primary-500 text-white
                   hover:bg-primary-600 shadow-sm focus:outline-none focus-visible:ring-2
                   focus-visible:ring-primary-600 focus-visible:ring-offset-2
                   disabled:opacity-60 disabled:cursor-not-allowed"
          >
            {{ sending() ? 'Enviando…' : 'Enviar convite' }}
          </button>
        </div>

        <p class="text-xs text-neutral-500 leading-relaxed">
          A pessoa recebe um link por e-mail e entra com a conta Google dela. O convite vale por
          {{ ttlLabel }} — depois disso é preciso reenviar.
        </p>
      </form>
    </app-page-card>

    <!--
      A LISTA SAIU DAQUI, e a tela ficou com um proposito so: convidar.

      Quem convidou alguem ha dois dias nao sabia em qual tela procurar — aqui ou em
      Membros. A pessoa convidada nao e um objeto diferente de um membro: e o MESMO
      objeto num estado anterior. Membros passou a mostrar as duas coisas na mesma
      lista, com o estado por linha e as acoes de reenviar e cancelar.

      Deixar as duas listas conviverem seria metade do conserto: a reclamacao nao era
      sobre rotas, era sobre procurar a mesma pessoa em dois lugares.
    -->
  </div>

</ng-template>

@if (embedded()) {
  <ng-container [ngTemplateOutlet]="inviteBody" />
} @else {
<app-default-page-layout
  title="Convites"
  description="Convide pessoas para acessar a sua empresa no MyCarsHub."
>
    <ng-container [ngTemplateOutlet]="inviteBody" />
  </app-default-page-layout>
}
