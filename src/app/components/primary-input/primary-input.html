<div>
    <label class="text-sm text-fg-muted">
        {{ label() }}@if (required()) {<span class="text-primary-700 dark:text-primary-400" aria-hidden="true">*</span>}
    </label>
    <div class="relative">
        @if (iconSrc()) {
        <div class="absolute left-4 top-1/2 transform -translate-y-1/2 pointer-events-none flex items-center">
            <img [ngSrc]="iconSrc()" alt="ícone de {{ label() }}" width="24" height="24">
        </div>
        }
        <input [type]="type()" [placeholder]="placeholder()" [value]="internalValue()" [disabled]="isDisabled()"
            [attr.maxlength]="maxLength()"
            [attr.aria-required]="required() ? 'true' : null"
            (input)="onInput($event)" class="w-full mt-1 bg-surface rounded-xl border border-edge-field pr-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-colors
                    disabled:opacity-60 disabled:bg-surface-muted disabled:cursor-not-allowed" [class.pl-12]="iconSrc()"
            [class.pl-4]="!iconSrc()" />
    </div>
</div>
