@if (open()) {
<div @backdrop class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm" (click)="onCancel()" aria-hidden="true"></div>

<div @dialog role="dialog" aria-modal="true" [attr.aria-labelledby]="'confirm-dialog-title'"
  [attr.aria-describedby]="'confirm-dialog-description'"
  class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3 sm:p-4 pointer-events-none">
  <div
    class="bg-surface rounded-t-2xl sm:rounded-2xl shadow-2xl border border-edge-soft w-full max-w-md pointer-events-auto overflow-hidden flex flex-col max-h-[calc(100dvh-1.5rem)]">

    <div class="flex items-start gap-3 sm:gap-4 p-4 sm:p-6 pb-3 sm:pb-4 shrink-0">
      <div class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center" [class]="iconBgClass()">
        @switch (variant()) {
        @case ('danger') {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-500 dark:text-red-300">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        }
        @case ('warning') {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500 dark:text-amber-300">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        }
        @default {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="text-primary-500 dark:text-primary-400">
          <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        </svg>
        }
        }
      </div>
      <div class="flex-1 min-w-0">
        <h2 id="confirm-dialog-title" class="text-base font-semibold text-fg leading-snug">
          {{ title() }}
        </h2>
        <p id="confirm-dialog-description" class="mt-1 text-fg-subtle leading-relaxed"
          [class.text-sm]="!large()" [class.text-base]="large()" [class.text-fg-soft]="large()">
          {{ message() }}
        </p>
      </div>
    </div>

    <!-- Optional rich body (e.g. a summary). Scrolls on its own so the buttons stay in view. -->
    <div class="min-h-0 overflow-y-auto overscroll-contain empty:hidden">
      <ng-content />
    </div>

    @if (optionLabel()) {
    <div class="px-4 sm:px-6 pb-1 shrink-0">
      <label
        class="flex items-start gap-3 rounded-xl border border-amber-200 dark:border-amber-500/30 bg-amber-50/70 dark:bg-amber-500/10 px-3 py-2.5 cursor-pointer"
        [class.min-h-[44px]]="large()">
        <input type="checkbox" [checked]="optionChecked()" (change)="onOptionToggle($event)"
          class="mt-0.5 shrink-0 accent-amber-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 focus-visible:ring-offset-1"
          [class.h-4]="!large()" [class.w-4]="!large()" [class.h-6]="large()" [class.w-6]="large()" />
        <span class="flex-1 min-w-0">
          <span class="block font-medium text-amber-900 dark:text-amber-200" [class.text-sm]="!large()"
            [class.text-base]="large()">{{ optionLabel() }}</span>
          @if (optionHint()) {
          <span class="mt-0.5 block leading-relaxed text-amber-800 dark:text-amber-200" [class.text-xs]="!large()"
            [class.text-base]="large()">{{ optionHint() }}</span>
          }
        </span>
      </label>
    </div>
    }

    <div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-end gap-2 sm:gap-3 p-4 sm:p-6 pt-3 sm:pt-4 shrink-0">
      @if (cancelLabel()) {
      <button #cancelBtn type="button" (click)="onCancel()" [disabled]="busy()"
        class="w-full sm:w-auto min-h-[44px] px-4 py-2.5 text-sm font-medium text-fg-muted bg-surface-sunken hover:bg-surface-strong rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-edge-strong disabled:opacity-60 cursor-pointer">
        {{ cancelLabel() }}
      </button>
      }
      @if (confirmLabel()) {
      <button type="button" (click)="onConfirm()" [disabled]="busy()" [class]="confirmBtnClass()"
        class="w-full sm:w-auto min-h-[44px] px-4 py-2.5 text-sm font-semibold rounded-xl transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 active:scale-[0.98] disabled:opacity-60 cursor-pointer">
        {{ confirmLabel() }}
      </button>
      }
    </div>
  </div>
</div>
}
