<div class="inline-flex" (appClickOutside)="closeOutside()">
  <button
    #trigger
    type="button"
    [id]="triggerId"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? menuId : null"
    aria-haspopup="menu"
    class="w-11 h-11 inline-flex items-center justify-center rounded-lg text-fg-subtle
           hover:bg-surface-sunken transition-colors focus-visible:outline-none
           focus-visible:ring-2 focus-visible:ring-primary-400"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true">
      <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
    </svg>
  </button>

  @if (open()) {
    <div
      #menu
      [id]="menuId"
      role="menu"
      [attr.aria-labelledby]="triggerId"
      (keydown)="onMenuKeydown($event)"
      (click)="onMenuClick($event)"
      [style.top.px]="position().top"
      [style.left.px]="position().left"
      [style.width.px]="position().width"
      [style.max-height.px]="position().maxHeight"
      [style.visibility]="positioned() ? 'visible' : 'hidden'"
      class="fixed z-[60] flex flex-col py-1 rounded-xl border border-edge bg-surface
             shadow-lg overflow-y-auto overscroll-contain [&>*]:shrink-0"
    >
      <ng-content />
    </div>
  }
</div>
