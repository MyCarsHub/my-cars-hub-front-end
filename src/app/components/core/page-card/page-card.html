<section class="bg-white rounded-2xl border border-neutral-200 shadow-sm overflow-hidden">

  <!-- Recuo do header acompanha o do corpo: a esmagadora maioria dos consumidores
       usa `p-4 sm:p-6` (ou `p-4`), então `px-6` fixo deixava o título 8px à direita
       dos rótulos abaixo dele em telas < sm. Acima de sm nada muda.

       `gap-2` + `shrink-0` nas ações: `justify-between` sozinho não reserva folga
       nenhuma entre o título e o slot `cardActions` — medido em 375px, a borda
       direita do título encostava EXATAMENTE na esquerda das ações (0px). O `gap`
       garante a folga e o `shrink-0` faz o título quebrar linha antes de espremer
       a ação, o que vale para todo consumidor de `cardActions`, não só um. -->
  <div class="px-4 sm:px-6 py-5 flex items-center justify-between gap-2">
    <div class="flex items-center gap-3">
      <ng-content select="[cardIcon]" />
      <h2 class="font-semibold text-neutral-800">{{ title() }}</h2>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <ng-content select="[cardActions]" />
      @if (collapsible()) {
        <button
          type="button"
          (click)="toggle()"
          class="inline-flex items-center justify-center min-h-[32px] min-w-[32px] px-1 rounded-lg
                 text-neutral-500 hover:text-neutral-900 hover:bg-neutral-100 transition
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
          [attr.aria-expanded]="open()"
          [attr.aria-controls]="contentId"
          [attr.aria-label]="open() ? 'Recolher ' + title() : 'Expandir ' + title()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true"
            [style.transform]="open() ? 'rotate(180deg)' : 'rotate(0deg)'"
            style="transition: transform .2s ease">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      }
    </div>
  </div>

  @if (open()) {
    <div [id]="contentId">
      <ng-content />
    </div>
  }

</section>
