<div [formGroup]="formGroup()" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
  @if (showContractDate()) {
    <app-form-field
      label="Data do contrato"
      controlId="financiamento-contract-date"
      [required]="true"
      [control]="control('contractDate')"
      [messages]="contractDateMessages"
    >
      <input
        appFieldControl
        type="date"
        formControlName="contractDate"
        class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
               focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
    </app-form-field>
  }

  <app-form-field
    label="Valor de compra (R$)"
    controlId="financiamento-purchase-price"
    [required]="true"
    [control]="control('purchasePrice')"
    [messages]="purchasePriceMessages"
  >
    <!-- type="text" + inputmode: `type="number"` recusa a vírgula do teclado
         pt-BR e impede a máscara de milhar de escrever no campo. -->
    <input
      appFieldControl
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="45.000,00"
      formControlName="purchasePrice"
      (input)="onMoneyInput($event, 'purchasePrice')"
      class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
             focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
  </app-form-field>

  <app-form-field
    label="Entrada (R$)"
    controlId="financiamento-down-payment"
    [control]="control('downPayment')"
    [messages]="downPaymentMessages"
  >
    <input
      appFieldControl
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="10.000,00"
      formControlName="downPayment"
      (input)="onMoneyInput($event, 'downPayment')"
      class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
             focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
  </app-form-field>

  <div class="grid grid-cols-2 gap-3">
    <app-form-field
      label="Parcelas"
      controlId="financiamento-installments"
      [control]="control('installments')"
    >
      <input
        appFieldControl
        type="number"
        min="0"
        inputmode="numeric"
        formControlName="installments"
        class="w-full bg-neutral-50 border rounded-xl px-3 py-3 text-neutral-800 tabular-nums
               focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
    </app-form-field>

    <app-form-field
      label="Valor da parcela (R$)"
      controlId="financiamento-installment-amount"
      [control]="control('installmentAmount')"
      [messages]="installmentAmountMessages"
    >
      <input
        appFieldControl
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="1.200,00"
        formControlName="installmentAmount"
        (input)="onMoneyInput($event, 'installmentAmount')"
        class="w-full bg-neutral-50 border rounded-xl px-3 py-3 text-neutral-800 tabular-nums
               focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
    </app-form-field>
  </div>
</div>
