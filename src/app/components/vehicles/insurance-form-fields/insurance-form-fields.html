<div [formGroup]="formGroup()" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
  <app-form-field
    label="Seguradora"
    controlId="seguro-insurer"
    [required]="true"
    [control]="control('insurer')"
    [messages]="insurerMessages"
  >
    <input
      appFieldControl
      type="text"
      autocomplete="off"
      formControlName="insurer"
      class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
             focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
  </app-form-field>

  <app-form-field
    label="Número da apólice"
    controlId="seguro-policy-number"
    [required]="true"
    [control]="control('policyNumber')"
    [messages]="policyNumberMessages"
  >
    <input
      appFieldControl
      type="text"
      autocomplete="off"
      formControlName="policyNumber"
      class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 tabular-nums
             focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
  </app-form-field>

  <app-form-field
    label="Cobertura"
    controlId="seguro-coverage-type"
    [required]="true"
    [control]="control('coverageType')"
    [messages]="coverageMessages"
  >
    <select
      appFieldControl
      formControlName="coverageType"
      class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
             focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors"
    >
      <option value="">Selecione…</option>
      @for (opt of coverageOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  </app-form-field>

  <app-form-field
    label="Forma de pagamento"
    controlId="seguro-payment-method"
    hint="Ex.: 12x no cartão, boleto anual…"
    [control]="control('paymentMethod')"
  >
    <input
      appFieldControl
      type="text"
      autocomplete="off"
      formControlName="paymentMethod"
      class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800
             focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
  </app-form-field>

  <div class="grid grid-cols-2 gap-3">
    <app-form-field
      label="Prêmio (R$)"
      controlId="seguro-premium-amount"
      [required]="true"
      [control]="control('premiumAmount')"
      [messages]="premiumMessages"
    >
      <input
        appFieldControl
        type="number"
        step="0.01"
        min="0"
        inputmode="decimal"
        formControlName="premiumAmount"
        class="w-full bg-neutral-50 border rounded-xl px-3 py-3 text-neutral-800 tabular-nums
               focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
    </app-form-field>

    <app-form-field
      label="Franquia (R$)"
      controlId="seguro-deductible-amount"
      [control]="control('deductibleAmount')"
    >
      <input
        appFieldControl
        type="number"
        step="0.01"
        min="0"
        inputmode="decimal"
        formControlName="deductibleAmount"
        class="w-full bg-neutral-50 border rounded-xl px-3 py-3 text-neutral-800 tabular-nums
               focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
    </app-form-field>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <app-form-field
      label="Início da vigência"
      controlId="seguro-start-date"
      [required]="true"
      [control]="control('startDate')"
      [messages]="startDateMessages"
    >
      <input
        appFieldControl
        type="date"
        formControlName="startDate"
        class="w-full bg-neutral-50 border rounded-xl px-3 py-3 text-neutral-800
               focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
    </app-form-field>

    <app-form-field
      label="Fim da vigência"
      controlId="seguro-end-date"
      [required]="true"
      [control]="control('endDate')"
      [messages]="endDateMessages"
    >
      <input
        appFieldControl
        type="date"
        formControlName="endDate"
        class="w-full bg-neutral-50 border rounded-xl px-3 py-3 text-neutral-800
               focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors" />
    </app-form-field>
  </div>

  @if (hasDateRangeError()) {
    <p class="md:col-span-2 text-xs text-rose-600" role="alert">
      O fim da vigência deve ser posterior ao início.
    </p>
  }

  <app-form-field
    label="Observações"
    controlId="seguro-notes"
    class="md:col-span-2"
    [control]="control('notes')"
  >
    <textarea
      appFieldControl
      rows="3"
      formControlName="notes"
      class="w-full bg-neutral-50 border rounded-xl px-4 py-3 text-neutral-800 resize-y
             focus:ring-2 focus:ring-primary-base/20 focus:border-primary-base transition-colors"
    ></textarea>
  </app-form-field>
</div>
