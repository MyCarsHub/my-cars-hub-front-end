<div [formGroup]="group()" class="space-y-3">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <app-form-field
      label="Valor da parcela (R$)"
      controlId="veiculo-ipva-amount"
      [required]="true"
      [control]="group().controls.amount"
      [messages]="amountMessages"
    >
      <!-- type="text" + inputmode: `type="number"` recusa a vírgula do teclado pt-BR e
           impede a máscara de milhar de escrever no campo. -->
      <input
        appFieldControl
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="1.234,56"
        formControlName="amount"
        (input)="onMoneyInput($event)"
        class="w-full min-w-0 bg-surface-muted border rounded-xl px-4 py-3 text-fg-body tabular-nums
               focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
    </app-form-field>

    <app-form-field
      label="Parcelas"
      controlId="veiculo-ipva-installments"
      [required]="true"
      [control]="group().controls.installments"
      [messages]="installmentsMessages"
    >
      <input
        appFieldControl
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="3"
        maxlength="2"
        formControlName="installments"
        class="w-full min-w-0 bg-surface-muted border rounded-xl px-4 py-3 text-fg-body tabular-nums
               focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
    </app-form-field>

    <app-form-field
      label="Início"
      controlId="veiculo-ipva-start"
      [required]="true"
      [control]="group().controls.start"
      [messages]="startMessages"
    >
      <input
        appFieldControl
        type="month"
        placeholder="AAAA-MM"
        formControlName="start"
        class="w-full min-w-0 bg-surface-muted border rounded-xl px-4 py-3 text-fg-body
               focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
    </app-form-field>

    <app-form-field
      label="Vencimento (dia)"
      controlId="veiculo-ipva-due-day"
      [required]="true"
      [control]="group().controls.dueDay"
      [messages]="dueDayMessages"
    >
      <input
        appFieldControl
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="10"
        maxlength="2"
        formControlName="dueDay"
        class="w-full min-w-0 bg-surface-muted border rounded-xl px-4 py-3 text-fg-body tabular-nums
               focus:ring-2 focus:ring-primary-600 focus:border-primary-600 transition-colors" />
    </app-form-field>
  </div>

  @if (preview(); as text) {
    <p class="text-sm text-fg-soft" data-testid="ipva-preview">{{ text }}</p>
  }
  <p class="text-xs text-fg-faint">
    Uma parcela por mês, a partir do mês de início, no dia do vencimento (mês curto usa o último
    dia). De 1 a {{ maxInstallments }} parcelas.
  </p>
</div>
