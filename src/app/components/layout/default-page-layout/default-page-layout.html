<!--
    FOLGA DO TOPO NO CELULAR — a conta, nao um chute.

    O botao de menu e `fixed` e flutua SOBRE esta secao. A folga aqui e a UNICA
    coisa que separa os dois, e ela vivia num arquivo diferente da posicao do
    botao: um numero adivinhado contra outro numero adivinhado.

    Agora os TRES elementos do topo partem da MESMA origem — o botao
    (sidebar.html), o sino (app-shell.ts) e este titulo carregam
    `env(safe-area-inset-top)`. A folga deixa de depender do tamanho do recorte
    do aparelho e vira aritmetica:

        topo do botao     1rem   (16px)
      + altura do botao   2.5rem (40px)  -> h-10
      + respiro           1rem   (16px)
      = 4.5rem                   (72px) + recorte

    A distancia entre o botao e o titulo e SEMPRE 16px, em qualquer aparelho.

    HISTORICO, porque errei dos DOIS lados e o motivo importa: primeiro a folga
    era `pt-20` fixa e o botao COBRIA as letras do titulo no iPhone — o
    <meta viewport> declara `viewport-fit=cover` e nao havia UMA regra de
    safe-area em todo o src, entao o app desenhava sob o recorte sem compensar.
    Depois eu somei o recorte SO AQUI e nao no botao: a distancia entre os dois
    cresceu pelo tamanho do recorte e o titulo foi parar longe demais.
    Somar nos DOIS LADOS e o que torna a conta estavel.
-->
<section class="w-full h-full px-4 sm:px-6 lg:px-10 pt-[var(--page-top,calc(4.5rem+env(safe-area-inset-top)))] lg:pt-10 pb-[calc(1.5rem+env(safe-area-inset-bottom))] sm:pb-8 lg:pb-10 max-w-8xl mx-auto space-y-6 sm:space-y-8 lg:space-y-10 bg-canvas">
    <!-- `--page-header-end`: folga à direita que o shell pede quando o sino divide a linha do título (motorista no celular). Sem ela, 0. -->
    <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 pr-[var(--page-header-end,0px)]">
        <div class="min-w-0">
            <!-- Slot opcional ACIMA do titulo (ex.: "‹ Vistorias" na tela de detalhes). Vazio nao ocupa nada. -->
            <ng-content select="[pageBack]"></ng-content>
            <!-- `flex-wrap`: o chip de situacao fica ao lado do titulo e desce para a linha de baixo quando nao cabe. -->
            <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
                <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight text-fg break-words min-w-0">
                    {{ title }}
                </h1>
                <!-- Slot opcional AO LADO do titulo (ex.: chip de situacao). -->
                <ng-content select="[pageBadge]"></ng-content>
            </div>
            <!-- neutral-600: o canvas é bg-canvas (#F0F0F0) e neutral-500 dá 4,16:1 — reprova AA. -->
            <p class="text-base sm:text-lg text-fg-muted mt-1.5">
                {{ description }}
            </p>
        </div>
        <!-- Slot opcional à direita do título (ex.: Editar e Excluir). Vazio não ocupa nada. -->
        <ng-content select="[pageActions]"></ng-content>
    </header>
    <div class="w-full">
        <!-- Cobrança da assinatura recusada: aviso com prazo, abaixo do título de toda página (mockup 03). -->
        <app-past-due-banner />
        <ng-content></ng-content>
    </div>
</section>
