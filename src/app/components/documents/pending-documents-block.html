<div class="p-4 sm:p-6 space-y-3">
  <p class="text-sm text-fg-muted">{{ description() }}</p>

  <!-- UM arquivo por tipo (regra de produto): slot vazio anexa, slot com
       pendente SUBSTITUI, slot já enviado tranca. Cores pelos tokens do tema
       (FIX-0236, decisão do usuário): vazio = VERMELHO tracejado (falta
       documento), com arquivo (pendente OU enviado) = VERDE. -->
  @for (slot of slots(); track slot.kind) {
    <div
      class="rounded-xl overflow-hidden transition-colors"
      [class.border]="slot.files.length > 0"
      [class.border-success-100]="slot.files.length > 0" [class.dark:border-success-500/20]="slot.files.length > 0"
      [class.bg-success-50]="slot.files.length > 0" [class.dark:bg-success-500/10]="slot.files.length > 0"
      [class.border-2]="slot.files.length === 0"
      [class.border-dashed]="slot.files.length === 0"
      [class.border-rose-500]="slot.files.length === 0"
      [class.bg-rose-50]="slot.files.length === 0" [class.dark:bg-rose-500/10]="slot.files.length === 0"
      [attr.data-doc-slot]="slot.kind"
      [attr.data-filled]="slot.files.length > 0 ? 'true' : 'false'"
    >
      <button
        type="button"
        (click)="openPicker(slot)"
        [disabled]="disabled() || slot.sent"
        [attr.aria-label]="slotAriaLabel(slot)"
        class="w-full flex items-center justify-between gap-3 px-4 py-3 text-left
               min-h-[44px] transition-colors
               focus-visible:outline focus-visible:outline-2
               focus-visible:outline-primary-600 disabled:cursor-not-allowed"
        [class.enabled:hover:bg-rose-100]="slot.files.length === 0" [class.dark:enabled:hover:bg-rose-500/15]="slot.files.length === 0"
        [class.enabled:hover:bg-success-100]="slot.files.length > 0" [class.dark:enabled:hover:bg-success-500/15]="slot.files.length > 0"
        [class.opacity-60]="disabled() || slot.sent">
        <span class="min-w-0">
          <span class="block text-sm font-medium text-fg-body">{{ slot.label }}</span>
          <span class="block text-xs text-fg-muted">{{ slot.hint }}</span>
        </span>
        @if (!slot.sent) {
          <span class="shrink-0 text-sm font-medium text-primary-700 dark:text-primary-400">
            {{ slot.files.length === 0 ? 'Anexar' : 'Substituir' }}
          </span>
        }
      </button>

      @if (slot.files.length > 0) {
        <ul class="border-t border-edge divide-y divide-edge bg-surface">
          @for (pf of slot.files; track pf.id) {
            <li class="flex items-center justify-between gap-3 px-4 py-2.5">
              <span class="min-w-0">
                <span class="block text-sm text-fg-body truncate">{{ pf.name }}</span>
                <span class="block text-xs text-fg-muted">{{ pf.sizeText }}</span>
              </span>
              @if (pf.sent) {
                <span class="shrink-0 text-xs font-semibold text-success-900 dark:text-emerald-300 bg-success-100 dark:bg-success-500/15 rounded-full px-2.5 py-1">
                  Enviado
                </span>
              } @else {
                <button
                  type="button"
                  (click)="fileRemoved.emit(pf.id)"
                  [disabled]="disabled()"
                  [attr.aria-label]="removeAriaLabel(pf)"
                  class="shrink-0 inline-flex items-center text-sm font-medium text-fg-muted
                         hover:text-rose-700 dark:hover:text-rose-300 px-3 min-h-[44px] rounded-lg
                         focus-visible:outline focus-visible:outline-2
                         focus-visible:outline-primary-600 disabled:opacity-60">
                  Remover
                </button>
              }
            </li>
          }
        </ul>
      }
    </div>
  }

  <input
    #picker
    type="file"
    [accept]="accept"
    hidden
    aria-hidden="true"
    tabindex="-1"
    (change)="onFileSelected($event)" />
</div>
