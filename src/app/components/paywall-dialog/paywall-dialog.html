@if (open()) {
  <div
    class="fixed inset-0 z-[70] flex items-end md:items-center justify-center"
    role="dialog"
    aria-modal="true"
    aria-labelledby="paywall-title"
    aria-describedby="paywall-body"
  >
    <!-- Backdrop -->
    <div
      @backdrop
      class="absolute inset-0 bg-neutral-900/70 dark:bg-neutral-700/70 backdrop-blur-sm"
      (click)="onBackdropClick()"
      aria-hidden="true"
    ></div>

    <!-- Sheet / Modal -->
    <div
      @sheet
      [class.paused]="paymentPaused()"
      class="relative w-full md:max-w-md md:w-[92%] bg-surface
             rounded-t-2xl md:rounded-2xl
             shadow-2xl overflow-hidden
             max-h-[85vh] md:max-h-[90vh]
             flex flex-col"
    >
      <!-- Mobile grabber -->
      <div class="md:hidden pt-2 pb-1 flex justify-center" aria-hidden="true">
        <span class="block w-10 h-1.5 rounded-full bg-surface-strong"></span>
      </div>

      <div class="px-5 pt-4 pb-6 sm:px-6 sm:pt-6 sm:pb-7 flex flex-col gap-5">
        <!-- Icon -->
        <div
          class="w-14 h-14 rounded-2xl flex items-center justify-center"
          [class.mx-auto]="!paymentPaused()"
          [class.bg-primary-50]="!paymentPaused()"
          [class.dark:bg-primary-500/10]="!paymentPaused()"
          [class.bg-surface-sunken]="paymentPaused()"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            [class]="paymentPaused() ? 'text-fg' : 'text-primary-600 dark:text-primary-400'"
          >
            <rect x="3" y="11" width="18" height="10" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>

        <div class="space-y-2" [class.text-center]="!paymentPaused()">
          <h2
            id="paywall-title"
            class="text-xl sm:text-2xl font-bold text-fg leading-tight"
          >
            {{ copy().title }}
          </h2>
          <p id="paywall-body" class="text-sm sm:text-base text-fg-muted leading-relaxed">
            {{ copy().body }}
          </p>
        </div>

        @if (paymentPaused() && amountDue()) {
          <dl class="paywall-kv">
            <div><dt>Em aberto</dt><dd>{{ amountDue() }}</dd></div>
          </dl>
        }

        <button
          type="button"
          data-paywall-cta
          (click)="onConfirm()"
          class="w-full min-h-[48px] px-5 py-3
                 bg-primary-500 hover:bg-primary-600 active:bg-primary-700
                 text-white font-bold rounded-xl
                 transition-colors
                 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:ring-offset-2"
        >
          {{ copy().cta }}
        </button>

        @if (paymentPaused()) {
          <button
            type="button"
            (click)="changeCard.emit()"
            class="w-full min-h-[48px] px-5 rounded-xl border border-edge bg-surface text-fg-body font-semibold
                   hover:bg-surface-sunken transition-colors press
                   focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
          >
            Trocar cartão
          </button>
          <button
            type="button"
            (click)="contactSupport.emit()"
            class="mx-auto min-h-[44px] px-3 text-sm font-semibold text-primary-700 dark:text-primary-400 hover:underline
                   focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 rounded-lg"
          >
            Falar com o suporte
          </button>
        }

        @if (!hardBlock()) {
          <button
            type="button"
            (click)="onDismiss()"
            class="w-full min-h-[44px] text-sm text-fg-subtle hover:text-fg-soft font-medium"
          >
            Agora não
          </button>
        }
      </div>
    </div>
  </div>
}
