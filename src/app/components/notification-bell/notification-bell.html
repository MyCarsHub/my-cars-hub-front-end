<button
  #trigger
  type="button"
  class="relative flex items-center justify-center w-10 h-10 rounded-lg bg-white shadow-md border border-gray-200 text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500"
  [attr.aria-label]="ariaLabel()"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
  (keydown.escape)="closeAndFocusTrigger()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
  </svg>

  @if (hasUnread()) {
    <span
      class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-white text-[10px] font-semibold leading-[18px] text-center tabular-nums"
      aria-hidden="true"
    >
      {{ badgeLabel() }}
    </span>
  }
</button>

<!-- Contador anunciado por leitor de tela sem depender do badge visual. -->
<span class="sr-only" aria-live="polite">{{ ariaLabel() }}</span>

@if (open()) {
  <div
    appClickOutside
    (appClickOutside)="onClickOutside($event)"
    (keydown.escape)="closeAndFocusTrigger()"
    (keydown)="onPanelKeydown($event)"
    role="menu"
    aria-label="Notificações recentes"
    class="fixed left-2 right-2 top-16 z-50 rounded-xl border border-neutral-200 bg-white shadow-xl sm:absolute sm:left-auto sm:right-0 sm:top-full sm:mt-2 sm:w-96"
  >
    <div class="flex items-center justify-between gap-2 px-4 py-3 border-b border-neutral-100">
      <p class="text-sm font-semibold text-neutral-900">Notificações</p>
      <button
        type="button"
        class="text-xs font-medium text-primary-700 hover:text-primary-900 px-2 py-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-400 disabled:opacity-50"
        [disabled]="!hasUnread()"
        (click)="onMarkAllRead()"
      >
        Marcar todas como lidas
      </button>
    </div>

    <div class="max-h-[60vh] overflow-y-auto">
      @if (loading() && items().length === 0) {
        <div class="p-4 space-y-2">
          <div class="h-12 rounded-lg bg-neutral-100 animate-pulse"></div>
          <div class="h-12 rounded-lg bg-neutral-100 animate-pulse"></div>
        </div>
      }

      @if (error(); as loadError) {
        <p class="px-4 py-6 text-sm text-rose-700">{{ loadError }}</p>
      }

      @if (!loading() && !error() && items().length === 0) {
        <p class="px-4 py-8 text-sm text-neutral-500 text-center">
          Nenhuma notificação por enquanto.
        </p>
      }

      @for (item of items(); track item.id) {
        <button
          #menuItem
          type="button"
          role="menuitem"
          class="w-full flex items-start gap-3 px-4 py-3 text-left min-h-[56px] hover:bg-neutral-50 focus:outline-none focus:bg-neutral-50 focus:ring-2 focus:ring-inset focus:ring-primary-400 border-b border-neutral-50 last:border-b-0"
          [class.bg-primary-50]="!item.read"
          (click)="onItemClick(item)"
        >
          <span
            class="mt-1.5 w-2 h-2 rounded-full shrink-0"
            [class]="severityDot(item.severity)"
            aria-hidden="true"
          ></span>
          <span class="min-w-0 flex-1">
            <span class="block text-sm font-semibold text-neutral-900 truncate">
              {{ item.title }}
            </span>
            <span class="block text-xs text-neutral-600 mt-0.5 line-clamp-2">
              {{ item.message }}
            </span>
            @if (dueLabel(item); as due) {
              <span class="block text-[11px] text-neutral-500 mt-1">{{ due }}</span>
            }
          </span>
        </button>
      }
    </div>

    <div class="px-4 py-3 border-t border-neutral-100">
      <a
        routerLink="/alertas"
        role="menuitem"
        class="block text-sm font-medium text-primary-700 hover:text-primary-900 focus:outline-none focus:ring-2 focus:ring-primary-400 rounded-lg py-1"
        (click)="closeAndFocusTrigger()"
      >
        Ver todos os alertas
      </a>
    </div>
  </div>
}
