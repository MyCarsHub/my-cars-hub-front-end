<button
  #trigger
  type="button"
  class="relative inline-flex h-11 min-w-11 items-center justify-center gap-2 px-2.5 text-gray-700 transition-transform focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 active:scale-95 dark:text-fg-soft motion-reduce:transition-none"
  [class]="triggerClass()"
  [attr.aria-label]="ariaLabel()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  data-tour="alerts"
  (click)="toggle()"
  (keydown.escape)="closeAndFocusTrigger()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
  </svg>

  <!-- Contador: número em fundo laranja claro, sem bolinha (canvas, prancha 3). -->
  @if (hasUnread()) {
    <span
      class="rounded-lg bg-primary-500/15 px-2 text-[13px] font-bold leading-[18px] text-primary-700 tabular-nums dark:text-primary-400"
      aria-hidden="true"
      data-bell-count
    >{{ badgeLabel() }}</span>
  }
</button>

<!-- Contador anunciado por leitor de tela sem depender do número visual. -->
<span class="sr-only" aria-live="polite">{{ ariaLabel() }}</span>

<!-- O painel é baixado na primeira abertura: só o gatilho e o contador ficam no pacote inicial. -->
@if (open()) {
  @if (panel(); as panelCmp) {
    <ng-container *ngComponentOutlet="panelCmp; inputs: { trigger: triggerEl() }" />
  } @else if (panelFailed()) {
    <div
      role="alert"
      class="fixed left-2 right-2 top-[calc(4rem+env(safe-area-inset-top))] z-50 flex flex-col items-start gap-3 rounded-[20px] bg-surface p-4 shadow-xl sm:absolute sm:left-auto sm:right-0 sm:top-full sm:mt-2 sm:w-[440px]"
      data-bell-chunk-error
    >
      <p class="text-[15px] text-fg-muted">Não foi possível abrir as notificações. Verifique a conexão e tente de novo.</p>
      <button
        type="button"
        class="flex min-h-11 items-center justify-center rounded-xl bg-primary-500 px-4 text-[15px] font-semibold text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 focus-visible:ring-offset-2"
        (click)="retryPanel()"
      >
        Tentar de novo
      </button>
    </div>
  }
}
